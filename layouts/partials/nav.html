<nav class="nav">
  <div class="nav-inner">
    <a href="{{ "/" | relURL }}" class="logo">{{ .Site.Title }}</a>
    <ul class="nav-menu">
      <li><a href="{{ "/" | relURL }}"{{ if .IsHome }} class="active"{{ end }}>首页</a></li>
      {{ $current := .RelPermalink }}
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if eq $current .URL }} class="active"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <div class="nav-actions">
      <button aria-label="搜索">🔍</button>
      <button aria-label="通知">🔔</button>
      <div class="avatar-sm"></div>
    </div>
  </div>
</nav>
